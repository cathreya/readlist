<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Caught Up — Lecture Today</title>
<style>
  :root { --bg: #faf9f7; --card: #fff; --text: #1a1a1a; --muted: #6b6b6b; --border: #e5e0d8; --accent: #2c5f2d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a1a; --card: #252525; --text: #e0e0e0; --muted: #999; --border: #333; --accent: #4caf50; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
  .container { max-width: 480px; width: 100%; margin: 2rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 3rem 2.5rem; }
  h1 { font-size: 2rem; margin-bottom: 1rem; }
  p { color: var(--muted); margin-bottom: 1.5rem; }
  .btn { display: inline-block; padding: .75rem 1.5rem; border-radius: 8px; border: 1px solid var(--border); font-size: .95rem; cursor: pointer; background: var(--card); color: var(--text); text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>You did it.</h1>
    <p>Every item in your list has been completed, skipped, or archived. That's genuinely impressive.</p>
    <p style="color: var(--muted); font-size: .9rem;">Want more? Add new links via <a href="/setup">Setup</a> or export a fresh copy of your Telegram read list and re-import.</p>
    <a href="/setup" class="btn btn-primary" style="margin-top:1rem">Add more content</a>
  </div>
</div>
</body>
</html>
